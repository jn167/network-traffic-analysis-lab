# /etc/dnsmasq.d/ntalab.conf on linux-endpoint
# A tiny "attacker-controlled" DNS server for the DNS tunneling scenario.
#
# It answers every name under ntalab.test (a reserved test TLD that can never
# exist on the real internet) and forwards nothing, so tunneling traffic
# stays inside the lab network.
listen-address=10.0.50.30
bind-interfaces
no-resolv
no-hosts
address=/ntalab.test/10.0.50.30
log-queries
log-facility=/var/log/dnsmasq-ntalab.log
