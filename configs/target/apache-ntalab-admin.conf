# /etc/apache2/conf-available/ntalab-admin.conf on linux-endpoint
# A fake admin page behind HTTP Basic auth, served over plain HTTP on purpose
# so the credentials cross the wire base64-encoded (not encrypted).
Alias /admin /var/www/ntalab-admin
<Directory /var/www/ntalab-admin>
    AuthType Basic
    AuthName "NTA Lab Admin"
    AuthUserFile /etc/apache2/.htpasswd-ntalab
    Require valid-user
</Directory>
